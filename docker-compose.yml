services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: recall-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - recall-net
    restart: unless-stopped
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recall-backend
    env_file:
      - ./backend/.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      SQLITE_PATH: /app/data/recall.db
      UPLOAD_FILE_DIR: /app/data/files
      CORS_ORIGINS: '["http://localhost", "http://localhost:80"]'
    volumes:
      - backend_data:/app/data
      - ./toolkit:/toolkit:ro
    networks:
      - recall-net
    depends_on:
      - qdrant
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recall-frontend
    ports:
      - "80:80"
    networks:
      - recall-net
    depends_on:
      - backend
    restart: unless-stopped

networks:
  recall-net:
    driver: bridge

volumes:
  qdrant_data:
  backend_data:
